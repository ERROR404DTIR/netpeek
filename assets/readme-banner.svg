<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Netpeek</title><desc id="d">A local network map shows devices connected to a central router.</desc><defs><linearGradient id="bg"><stop stop-color="#142c3d"/><stop offset="1" stop-color="#09111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><g stroke="#62e3c1" stroke-width="3" fill="none"><path d="M600 145L300 80M600 145L300 220M600 145L900 80M600 145L900 220M600 145L600 245"/></g><g fill="#142f43" stroke="#8fa8ff" stroke-width="3"><rect x="530" y="105" width="140" height="80" rx="12"/><rect x="220" y="48" width="160" height="64" rx="10"/><rect x="220" y="188" width="160" height="64" rx="10"/><rect x="820" y="48" width="160" height="64" rx="10"/><rect x="820" y="188" width="160" height="64" rx="10"/></g><g fill="#edf3ff" font-family="monospace" font-size="14" text-anchor="middle"><text x="600" y="152">ROUTER</text><text x="300" y="88">DEVICE 01</text><text x="300" y="228">DEVICE 02</text><text x="900" y="88">DEVICE 03</text><text x="900" y="228">DEVICE 04</text></g><circle r="7" fill="#62e3c1"><animateMotion dur="3s" repeatCount="indefinite" path="M600 145L300 80"/></circle><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">NETPEEK</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">DISCOVER / MAP / IDENTIFY</text></svg>